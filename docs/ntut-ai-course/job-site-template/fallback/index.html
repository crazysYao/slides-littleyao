<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的求職網站</title>
<!-- 保底網頁：網站 v1 做不出來時，用這份蓋掉 site/index.html，一樣能上線，之後再慢慢換成自己的內容 -->
<style>
  :root {
    --bg: #fbfaf7;
    --ink: #16161a;
    --muted: #62646b;
    --accent: #f5b400;
    --card: #ffffff;
    --line: #ebe7de;
    --on-ink: #ffffff;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.7; }
  a { color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  nav { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 1; }
  nav .wrap { display: flex; gap: 18px; overflow-x: auto; padding-top: 12px; padding-bottom: 12px; font-size: 14px; white-space: nowrap; }
  nav a { text-decoration: none; color: var(--muted); }
  .hero { padding: 72px 0 56px; }
  .hero .tag { display: inline-block; background: var(--accent); padding: 2px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
  .hero h1 { font-size: clamp(36px, 7vw, 64px); line-height: 1.15; margin: 16px 0 12px; }
  .hero p { font-size: clamp(17px, 2.4vw, 21px); color: var(--muted); margin: 0 0 28px; max-width: 640px; }
  .btn { display: inline-block; background: var(--ink); color: var(--on-ink); text-decoration: none; padding: 12px 24px; border-radius: 999px; font-weight: 700; }
  section { padding: 40px 0; border-top: 1px solid var(--line); }
  h2 { font-size: 26px; margin: 0 0 18px; }
  h2::after { content: ""; display: block; width: 40px; height: 5px; background: var(--accent); border-radius: 3px; margin-top: 6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .card h3 { margin: 0 0 6px; font-size: 19px; }
  .card .meta { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .num { font-size: 32px; font-weight: 800; line-height: 1.1; }
  ul { margin: 0; padding-left: 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; }
  .chips li { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 15px; }
  footer { padding: 32px 0 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<nav><div class="wrap">
  <a href="#about">關於我</a><a href="#goal">方向</a><a href="#edu">學歷</a><a href="#project">專題</a><a href="#exp">經歷</a><a href="#skills">技能</a><a href="#contact">聯絡</a>
</div></nav>

<header class="hero" id="about"><div class="wrap">
  <span class="tag" data-slot="tag">2026 應屆畢業・求職中</span>
  <h1 data-slot="name">嗨，我是應屆畢業生</h1>
  <p data-slot="intro">喜歡把事情做完、做好，正在找第一份工作。</p>
  <a class="btn" href="#contact" data-slot="cta">跟我聯絡</a>
</div></header>

<main>
<section id="goal"><div class="wrap">
  <h2 data-slot="h-goal">我想做的工作</h2>
  <p data-slot="goal">希望加入願意帶新人的團隊，從實作中快速成長。</p>
</div></section>

<section id="edu"><div class="wrap">
  <h2 data-slot="h-edu">學歷</h2>
  <p data-slot="edu">2026 年大學畢業</p>
</div></section>

<section id="project"><div class="wrap">
  <h2 data-slot="h-project">代表專題</h2>
  <div class="cards">
    <article class="card">
      <h3 data-slot="project-title">課堂專題</h3>
      <p class="meta" data-slot="project-role">小組合作</p>
      <p data-slot="project-body">和組員分工完成一個完整的作品，從規劃做到發表。</p>
    </article>
    <article class="card">
      <p class="num" data-slot="project-number">1 個</p>
      <p class="meta" data-slot="project-number-label">從零做到完成的作品</p>
    </article>
  </div>
</div></section>

<section id="exp"><div class="wrap">
  <h2 data-slot="h-exp">經歷</h2>
  <div class="cards">
    <article class="card">
      <h3 data-slot="exp-title">社團與打工</h3>
      <p class="meta" data-slot="exp-meta">大學期間</p>
      <p data-slot="exp-body">學會跟不同的人合作、準時把事情交出去。</p>
    </article>
  </div>
</div></section>

<section id="skills"><div class="wrap">
  <h2 data-slot="h-skills">技能</h2>
  <ul class="chips" data-slot="skills">
    <li>團隊合作</li><li>用 AI 做網站</li><li>簡報表達</li>
  </ul>
</div></section>

<section id="contact"><div class="wrap">
  <h2 data-slot="h-contact">聯絡我</h2>
  <ul data-slot="contact">
    <li>Email：待補</li>
  </ul>
</div></section>
</main>

<footer><div class="wrap" data-slot="footer">© 2026・這個網站由我和 AI 一起做出來</div></footer>
</body>
</html>
