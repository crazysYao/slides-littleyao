<style>
#alp{--line:#EDE6D8;--ink:#2B2620;--mute:#8A8275;--y:#F5B400;--yd:#D99A00;--y2:#FFF3CC;--ok:#2E8B57;--red:#D0121B;--obs:#7C3AED;--cla:#D97757;position:absolute;left:0;top:0;width:960px;height:540px}
#alp *{box-sizing:border-box}
#alp .outer{position:absolute;left:44px;top:112px;width:576px;height:288px}
#alp .stage{zoom:.6;position:absolute;top:0;left:0;width:960px;height:480px;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden}
#alp .stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#FFF8E2 0,transparent 60%);pointer-events:none}
#alp svg.edges{position:absolute;left:0;top:0;width:960px;height:480px}
#alp .edge{stroke:#DDD6C8;stroke-width:4;stroke-dasharray:10 8;fill:none;transition:stroke .3s}
#alp .edge.on{stroke:var(--y)}
#alp .node{position:absolute;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 16px;transition:all .3s;box-shadow:0 8px 20px rgba(60,40,0,.06)}
#alp .node.on{border-color:var(--y);box-shadow:0 0 0 6px rgba(245,180,0,.18),0 8px 20px rgba(60,40,0,.08)}
#alp .nh{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;color:var(--ink)}
#alp .nh svg{width:34px;height:34px;flex:none}
#alp .ns{font-size:14px;color:var(--mute);margin-top:4px}
#alp .me{left:30px;top:180px;width:170px;text-align:center}
#alp .me .face{width:56px;height:56px;margin:0 auto 6px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900}
#alp .ag{left:350px;top:190px;width:230px;text-align:center}
#alp .ag .nh{justify-content:center}
#alp .sk{left:330px;top:24px;width:270px}
#alp .skc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#alp .chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute);transition:all .3s}
#alp .chip.on{background:var(--y);border-color:var(--y);color:var(--ink);font-weight:800}
#alp .ob{left:700px;top:30px;width:230px}
#alp .gd{left:700px;top:330px;width:230px}
#alp .mcp{position:absolute;left:612px;top:300px;z-index:2;background:var(--ink);color:#fff;font-size:13px;font-weight:900;padding:3px 10px;border-radius:999px;transition:all .3s}
#alp .mcp.on{background:var(--y);color:var(--ink)}
#alp .row{font-size:14px;padding:6px 10px;border-radius:8px;margin-top:6px;background:#F7F4EE;color:var(--ink);transition:all .3s}
#alp .row.on{background:var(--y2);outline:2px solid var(--y)}
#alp .row.add{opacity:0;transform:translateY(6px)}
#alp .row.add.vis{opacity:1;transform:none;background:#FDECEC;outline:2px solid #F5C2C2}
#alp .bub{position:absolute;max-width:300px;padding:10px 14px;border-radius:14px;font-size:16px;line-height:1.5;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;z-index:3}
#alp .bub.vis{opacity:1;transform:none}
#alp .bub.mine{left:30px;top:340px;background:#16161a;color:#fff}
#alp .bub.ai{left:350px;top:350px;width:300px;background:#fff;border:2px solid var(--cla)}
#alp .ok{color:var(--ok);font-weight:900}
#alp .ng{color:var(--red);font-weight:900}
#alp .pkt{position:absolute;top:0;left:0;z-index:5;opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;white-space:nowrap}
#alp .caption{position:absolute;left:44px;top:406px;width:576px;text-align:center;font-size:15px;font-weight:700;min-height:22px;transition:opacity .25s}
#alp .caption.fade{opacity:0}
#alp .ctl{position:absolute;left:44px;top:446px;display:flex;gap:8px}
#alp .btn{border:1px solid var(--line);background:#fff;font:inherit;font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--ink)}
#alp .cards{position:absolute;left:644px;right:44px;top:112px;display:grid;gap:8px}
#alp .rc{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;transition:all .3s}
#alp .rc .n{flex:0 0 26px;height:26px;border-radius:13px;background:var(--y);display:grid;place-items:center;font-weight:900;font-size:13px}
#alp .rc .tt{font-size:14px;font-weight:800}
#alp .rc .ss{font-size:11px;color:var(--mute);margin-top:2px;line-height:1.35}
#alp .rc .chk{margin-left:auto;flex:0 0 22px;height:22px;border-radius:50%;background:#E8F6EC;color:var(--ok);display:grid;place-items:center;font-size:12px;opacity:0;transform:scale(.6);transition:all .3s}
#alp .rc.active{border-color:var(--y);box-shadow:0 6px 18px rgba(245,180,0,.18)}
#alp .rc.fin .chk{opacity:1;transform:none}
#alp .rc:not(.active):not(.fin){opacity:.7}
.cap #alp .pkt,.cap #alp .ctl{display:none}
@media (prefers-reduced-motion:reduce){#alp .pkt{display:none}}
</style>

<script>
(() => {
const $ = (s) => document.querySelector('#alp ' + s);
const stage = $('#stage'), pkt = $('#pkt'), caption = $('#caption'), bMe = $('#b-me'), bAi = $('#b-ai');
const SCALE = 0.6;
let runId = 0, looping = true;
const sleep = (ms, t) => new Promise((res, rej) => setTimeout(() => (t !== runId ? rej('cancel') : res()), ms));
const ctr = (el) => { const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: (r.left - s.left + r.width / 2) / SCALE, y: (r.top - s.top + r.height / 2) / SCALE }; };
const on = (ids, v = true) => ids.forEach((id) => $('#' + id).classList.toggle('on', v));
const setCap = (txt) => { caption.classList.add('fade'); setTimeout(() => { caption.textContent = txt; caption.classList.remove('fade'); }, 200); };
const setStep = (n) => document.querySelectorAll('#alp .rc').forEach((s) => { const k = +s.dataset.step; s.classList.toggle('active', k === n); s.classList.toggle('fin', k < n); });
const say = async (t, b, html, ms = 1200) => { b.innerHTML = html; b.classList.add('vis'); await sleep(ms, t); };
const send = async (t, label, from, to, edge) => {
  on([edge]); const a = ctr($('#' + from)), b = ctr($('#' + to)); pkt.textContent = label;
  pkt.animate([
    { transform: `translate(${a.x}px,${a.y}px) translate(-50%,-50%) scale(.6)`, opacity: 0 },
    { transform: `translate(${a.x}px,${a.y}px) translate(-50%,-50%) scale(1)`, opacity: 1, offset: 0.15 },
    { transform: `translate(${b.x}px,${b.y}px) translate(-50%,-50%) scale(1)`, opacity: 1, offset: 0.85 },
    { transform: `translate(${b.x}px,${b.y}px) translate(-50%,-50%) scale(.6)`, opacity: 0 },
  ], { duration: 1100, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' });
  await sleep(1100, t); on([edge], false);
};
function reset() {
  document.querySelectorAll('#alp .on').forEach((x) => x.classList.remove('on'));
  [bMe, bAi].forEach((b) => b.classList.remove('vis')); $('#r-new').classList.remove('vis');
  pkt.getAnimations().forEach((a) => a.cancel()); pkt.style.opacity = 0; setStep(0); caption.innerHTML = '&nbsp;';
}
async function run() {
  const t = ++runId; reset();
  try {
    await sleep(500, t);
    setStep(1); setCap('步驟 1：我只說一句「今天練什麼？」'); on(['n-me']);
    await say(t, bMe, '今天練什麼？', 900);
    await send(t, '今天練什麼？', 'n-me', 'n-ag', 'e-me'); on(['n-me'], false); on(['n-ag']);
    setStep(2); setCap('步驟 2：Agent 去書架拿出「測驗」這本 Skill');
    await send(t, '找手冊', 'n-ag', 'n-sk', 'e-sk'); on(['n-sk', 'c-quiz']); await sleep(900, t);
    await send(t, '測驗 Skill', 'n-sk', 'n-ag', 'e-sk'); on(['n-sk'], false);
    setStep(3); setCap('步驟 3：照手冊，先讀我的複習清單和學習紀錄');
    on(['n-ob']); await send(t, '讀我的資料', 'n-ag', 'n-ob', 'e-ob');
    on(['r-rev']); await sleep(500, t); on(['r-log']); await sleep(700, t);
    await send(t, '貯める／稼ぐ、ちゃう…', 'n-ob', 'n-ag', 'e-ob'); on(['n-ob', 'r-rev', 'r-log'], false);
    setCap('再透過 MCP 到 Google Drive，找同類型的考古題');
    on(['n-gd', 'mcp']); await send(t, '找同類考古題', 'n-ag', 'n-gd', 'e-gd'); on(['r-pdf']); await sleep(600, t);
    await send(t, '考古題第 12 題', 'n-gd', 'n-ag', 'e-gd'); on(['n-gd', 'mcp', 'r-pdf'], false);
    setCap('只出我弱的地方：不是教材第一課');
    await say(t, bAi, '「存錢」是哪一個？（N3 考古題）<br>A 貯める　B 稼ぐ', 1300);
    on(['n-me']); await say(t, bMe, 'B 稼ぐ', 700); await send(t, 'B', 'n-me', 'n-ag', 'e-me'); on(['n-me'], false);
    setStep(4); setCap('步驟 4：答錯了，Agent 把這題寫回 Obsidian 的複習清單');
    await say(t, bAi, '<span class="ng">✗</span> 存錢是 貯める（ためる），稼ぐ 是賺錢', 1200);
    on(['n-ob']); await send(t, '寫回錯題', 'n-ag', 'n-ob', 'e-ob'); $('#r-new').classList.add('vis'); on(['r-rev']); await sleep(1200, t);
    setStep(5); setCap('資料在我手上，Agent 照 Skill 讀寫，每天越來越懂我');
    await sleep(3000, t);
    if (looping) run();
  } catch (e) { if (e !== 'cancel') console.error(e); }
}
function finalState() {
  reset(); setStep(5);
  bMe.textContent = '今天練什麼？'; bMe.classList.add('vis');
  bAi.innerHTML = '<span class="ng">✗</span> 存錢是 貯める（ためる），稼ぐ 是賺錢'; bAi.classList.add('vis');
  on(['c-quiz', 'r-rev']); $('#r-new').classList.add('vis');
  caption.textContent = '資料在我手上，Agent 照 Skill 讀寫，每天越來越懂我';
}
$('#replay').onclick = () => run();
$('#loopBtn').onclick = (e) => { looping = !looping; e.target.textContent = '自動循環：' + (looping ? '開' : '關'); };
if (window.__SYNORA_CAPTURE__ || matchMedia('(prefers-reduced-motion: reduce)').matches) finalState(); else run();
})();
</script>
