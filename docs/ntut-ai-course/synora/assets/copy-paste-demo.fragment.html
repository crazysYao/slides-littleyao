<style>#cpd{--bg:#FBF6EC;--card:#fff;--line:#EDE6D8;--ink:#2B2620;--mute:#8A8275;--y:#F5B400;--yd:#D99A00;--y2:#FFF3CC;--ok:#2E8B57;position:absolute;left:0;top:0;width:960px;height:540px}#cpd *{box-sizing:border-box}
#cpd .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
#cpd .seg button,#cpd .btn{border:0;background:transparent;font:inherit;font-size:14px;padding:7px 16px;border-radius:999px;cursor:pointer;color:var(--mute)}

  display:flex;align-items:center;justify-content:space-around;padding:20px 36px}

#cpd .chat.dim{opacity:.45;filter:saturate(.6)}
#cpd .chat-head{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;color:var(--mute);margin-bottom:12px}
#cpd .avatar{width:28px;height:28px;border-radius:50%;background:var(--y);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
#cpd .bubble{position:relative;background:#fff;border-radius:14px;padding:14px 18px;font-size:15px;line-height:1.75;border:1px solid var(--line)}
#cpd .bubble b{display:block;margin-bottom:2px}
#cpd .bubble .hl{position:absolute;inset:0;background:rgba(245,180,0,.26);border-radius:14px;transform-origin:left center;transform:scaleX(0);transition:transform 1s cubic-bezier(.4,0,.2,1);pointer-events:none}
#cpd .bubble.sel .hl{transform:scaleX(1)}
#cpd .copy-btn{margin-top:10px;display:inline-flex;gap:6px;align-items:center;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--mute);transition:all .2s}
#cpd .copy-btn svg{width:15px;height:15px}
#cpd .copy-btn.press{transform:scale(.9);background:var(--y);color:#fff;border-color:var(--y)}
#cpd .copy-btn.fin{background:#E8F6EC;color:var(--ok);border-color:#BFE5CB}
#cpd .device{position:relative;transition:width .5s,height .5s,border-radius .5s,padding .5s,box-shadow .4s}
#cpd .device.phone{width:250px;height:440px;background:#1d1d1f;border-radius:42px;padding:10px;box-shadow:0 18px 40px rgba(60,40,0,.18)}
#cpd .device.desktop{width:440px;height:320px;background:#d9d4ca;border-radius:14px;padding:1px;box-shadow:0 18px 40px rgba(60,40,0,.16)}
#cpd .device.active{box-shadow:0 0 0 4px rgba(245,180,0,.45),0 18px 40px rgba(60,40,0,.18)}
#cpd .screen{position:relative;height:100%;background:#fff;overflow:hidden;display:flex;flex-direction:column}
#cpd .phone .screen{border-radius:32px}
#cpd .desktop .screen{border-radius:13px}
#cpd .statusbar{display:flex;justify-content:space-between;font-size:11px;font-weight:600;padding:10px 22px 4px}
#cpd .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:76px;height:20px;background:#1d1d1f;border-radius:12px}
#cpd .d-top{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:14px}
#cpd .back{color:var(--yd);font-weight:500}
#cpd .desktop .d-top{background:#F3F0EA;border-bottom:1px solid #e6e1d6;padding:9px 12px;font-size:12px;color:var(--mute)}
#cpd .dots{display:flex;gap:6px}

#cpd .dots i:nth-child(2){background:#febc2e}

#cpd .d-title{flex:1;text-align:center;font-weight:600;margin-right:40px}

#cpd .phone .dots,#cpd .phone .d-title,#cpd .phone .sidebar{display:none}
#cpd .desktop .statusbar,#cpd .desktop .notch,#cpd .desktop .back{display:none}
#cpd .note{flex:1;position:relative;padding:12px 18px}

#cpd .desktop .note-title{font-size:18px}
#cpd .ph{color:#cfc8ba;font-weight:500}
#cpd .note-
.note-body .ph{font-size:13px}
#cpd .caret{display:none;width:2px;height:1.1em;background:var(--yd);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) 40}

@keyframes blink{50%{opacity:0}}
#cpd .pasted div{opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
#cpd .pasted div.vis{opacity:1;transform:none}
#cpd .pasted .pflash{position:absolute;inset:-4px -6px;background:rgba(245,180,0,.22);border-radius:8px;opacity:0;transition:opacity .6s}
#cpd .pasted.flash .pflash{opacity:1}
#cpd .menu{position:absolute;top:-38px;left:8px;opacity:0;transform:translateY(6px) scale(.95);transition:all .2s;pointer-events:none;z-index:3}
#cpd .menu.show{opacity:1;transform:none}
#cpd .phone .menu{background:#2b2b2d;color:#fff;border-radius:9px;padding:7px 16px;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#cpd .phone .menu::after{content:"";position:absolute;bottom:-6px;left:22px;border:6px solid transparent;border-bottom:0;border-top-color:#2b2b2d}
#cpd .desktop .menu{top:18px;left:60px;background:#fff;border:1px solid #ddd6c8;border-radius:8px;padding:4px;font-size:12px;width:150px;box-shadow:0 8px 20px rgba(0,0,0,.14)}
#cpd .desktop .menu .mi{padding:5px 10px;border-radius:5px;display:flex;justify-content:space-between;color:#555}
#cpd .desktop .menu .mi span{color:#aaa}
#cpd .desktop .menu .mi.target.hover{background:var(--y);color:#fff}
#cpd .desktop .menu .mi.target.hover span{color:#fff}
#cpd .saved{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;align-items:center;background:#E8F6EC;color:var(--ok);border:1px solid #BFE5CB;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;opacity:0;transform:scale(.8);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
#cpd .saved.show{opacity:1;transform:none}
#cpd .saved svg{width:14px;height:14px}
#cpd .toast{position:absolute;top:18px;left:50%;transform:translate(-50%,-20px);background:var(--ink);color:#fff;font-size:14px;padding:9px 18px;border-radius:999px;opacity:0;transition:all .3s;z-index:5;display:flex;gap:8px;align-items:center}
#cpd .toast.show{opacity:1;transform:translate(-50%,0)}
#cpd .fly{position:absolute;top:0;left:0;z-index:6;opacity:0;pointer-events:none;background:#fff;border:2px solid var(--y);border-radius:12px;padding:8px 12px;font-size:12px;box-shadow:0 10px 24px rgba(200,140,0,.3);display:flex;gap:8px;align-items:center;white-space:nowrap}
#cpd .fly .ic{width:26px;height:26px;border-radius:7px;background:var(--y);display:grid;place-items:center}
#cpd .fly .ic svg{width:15px;height:15px;stroke:#fff}
#cpd .cursor{position:absolute;top:0;left:0;z-index:7;pointer-events:none;transform:translate(480px,560px)}
#cpd .cursor .arrow{width:24px;height:24px;transform:translate(-3px,-2px);transition:transform .12s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
#cpd .cursor .touch{display:none;width:34px;height:34px;border-radius:50%;background:rgba(43,38,32,.18);border:2px solid rgba(43,38,32,.35);transform:translate(-50%,-50%);transition:transform .12s}
#cpd .cursor.is-touch .arrow{display:none}
#cpd .cursor.is-touch .touch{display:block}
#cpd .cursor.down .arrow{transform:translate(-3px,-2px) scale(.85)}
#cpd .cursor.down .touch{transform:translate(-50%,-50%) scale(.8)}
#cpd .ripple{position:absolute;z-index:6;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--y);pointer-events:none;animation:rip .5s ease-out forwards}
#cpd .ripple.long{animation:rip-long .75s ease-out forwards;background:rgba(245,180,0,.18)}
@keyframes rip{to{transform:scale(3.2);opacity:0}}
@keyframes rip-long{0%{transform:scale(1);opacity:1}80%{transform:scale(4);opacity:.8}100%{transform:scale(4.4);opacity:0}}
#cpd .caption{margin:14px 0 14px;min-height:28px;font-size:17px;font-weight:600;text-align:center;transition:opacity .25s}
#cpd .caption.fade{opacity:0}
#cpd .steps{display:grid;gap:12px}
#cpd .step{display:flex;align-items:center;gap:18px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 18px;transition:all .3s}
#cpd .step .n{width:16px;color:var(--mute);font-size:14px;text-align:center}
#cpd .step .ic{width:54px;height:54px;border-radius:14px;background:var(--y);display:grid;place-items:center;flex:none;transition:transform .3s}
#cpd .step .ic svg{width:28px;height:28px}
#cpd .step .t{font-size:19px;font-weight:700}
#cpd .step .s{font-size:13px;color:var(--mute);margin-top:2px}
#cpd .step .chk{margin-left:auto;width:26px;height:26px;border-radius:50%;background:#E8F6EC;color:var(--ok);display:grid;place-items:center;opacity:0;transform:scale(.5);transition:all .3s}
#cpd .step.active{border-color:var(--y);box-shadow:0 6px 18px rgba(245,180,0,.18)}
#cpd .step.active .ic{transform:scale(1.08)}
#cpd .step.fin .chk{opacity:1;transform:none}
#cpd .step:not(.active):not(.fin){opacity:.7}
#cpd .outer{position:absolute;left:44px;top:112px;width:576px;height:288px}
#cpd .stage{zoom:.6}
#cpd .caption{position:absolute;left:44px;top:406px;width:576px;margin:0;font-size:15px}
#cpd .ctl{position:absolute;left:44px;top:446px;display:flex;gap:8px;align-items:center}
#cpd .seg button,#cpd .btn{font-size:12px;padding:5px 12px}
#cpd .steps{position:absolute;left:644px;right:44px;top:112px;gap:10px}
#cpd .step{gap:10px;padding:10px 12px;border-radius:12px}
#cpd .step .ic{width:40px;height:40px;border-radius:10px}#cpd .step .ic svg{width:22px;height:22px}
#cpd .step .t{font-size:15px}#cpd .step .s{font-size:11px}
#cpd .step .chk{width:22px;height:22px;font-size:12px}
.cap #cpd .toast,.cap #cpd .fly,.cap #cpd .cursor,.cap #cpd .menu,.cap #cpd .ripple,.cap #cpd .ctl{display:none}
@media (prefers-reduced-motion:reduce){#cpd .toast,#cpd .fly,#cpd .cursor,#cpd .menu,#cpd .ripple{display:none}}</style>

<script>
const $ = s => document.querySelector('#cpd '+s);
const stage=$('#stage'), outer=$('#outer'), cursor=$('#cursor'), chat=$('#chat'), bubble=$('#bubble'),
      copyBtn=$('#copyBtn'), copyLabel=$('#copyLabel'), toast=$('#toast'), fly=$('#fly'), device=$('#device'),
      noteTitle=$('#noteTitle'), titlePh=$('#titlePh'), tt=$('#tt'), noteBody=$('#noteBody'), bodyPh=$('#bodyPh'),
      pasted=$('#pasted'), menu=$('#menu'), saved=$('#saved'), caption=$('#caption');
const LINES=['「我的基本資料」','學校：北科大 資工系','想做：前端工程師','專題：校園二手書平台','技能：HTML、Figma'];
let runId=0, scale=1, mode='phone', looping=true, cx=480, cy=560;

/* ---------- layout ---------- */
scale=.6;

/* ---------- helpers ---------- */
const sleep=(ms,t)=>new Promise((res,rej)=>setTimeout(()=>t!==runId?rej('cancel'):res(),ms));
function pos(el,fx=.5,fy=.5){ const s=stage.getBoundingClientRect(), r=el.getBoundingClientRect();
  return {x:(r.left-s.left+r.width*fx)/scale, y:(r.top-s.top+r.height*fy)/scale}; }
function place(x,y,dur){ cx=x; cy=y; cursor.style.transition = dur?`transform ${dur}ms cubic-bezier(.45,.05,.25,1)`:'none'; cursor.style.transform=`translate(${x}px,${y}px)`; }
async function move(t,el,fx,fy,dur=700){ const p=pos(el,fx,fy); place(p.x,p.y,dur); await sleep(dur,t); }
function ripple(long){ const r=document.createElement('div'); r.className='ripple'+(long?' long':''); r.style.left=cx+'px'; r.style.top=cy+'px'; stage.appendChild(r); setTimeout(()=>r.remove(),900); }
async function click(t,long=false){ cursor.classList.add('down'); ripple(long); await sleep(long?650:140,t); cursor.classList.remove('down'); }
function setCap(txt){ caption.classList.add('fade'); setTimeout(()=>{caption.textContent=txt; caption.classList.remove('fade');},200); }
function setStep(n){ document.querySelectorAll('#cpd .step').forEach(s=>{ const k=+s.dataset.step; s.classList.toggle('active',k===n); s.classList.toggle('fin',k<n); }); }

function buildMenu(){
  if(mode==='phone'){ menu.innerHTML='<div class="mi target">貼上</div>'; }
  else { const mod=/Mac/i.test(navigator.platform)?'⌘':'Ctrl+';
    menu.innerHTML=`<div class="mi">剪下<span>${mod}X</span></div><div class="mi">拷貝<span>${mod}C</span></div><div class="mi target">貼上<span>${mod}V</span></div>`; }
  $('#s2t').textContent = mode==='phone' ? '貼到手機備忘錄' : '貼到電腦的記事本';
  $('#s2s').textContent = mode==='phone' ? '或 Google Keep，拿得到就好' : '備忘錄、Word、Google 文件都可以';
}

function reset(){
  [bubble,device,chat,menu,saved,toast,pasted,noteTitle,noteBody,cursor].forEach(e=>e.classList.remove('sel','active','dim','show','flash','focus','down','is-touch'));
  copyBtn.className='copy-btn'; copyLabel.textContent='複製';
  titlePh.style.display=''; bodyPh.style.display=''; tt.textContent='';
  pasted.querySelectorAll('div').forEach(d=>d.remove());
  fly.getAnimations().forEach(a=>a.cancel()); fly.style.opacity=0;
  place(480,560,0); setStep(0); caption.innerHTML='&nbsp;';
}

/* ---------- timeline ---------- */
async function run(){
  const t=++runId; reset(); buildMenu();
  try{
    await sleep(600,t);
    // Step 1: select + copy
    setStep(1); setCap('步驟 1：把 AI 最後給的「我的基本資料」整段選起來');
    await move(t,bubble,.05,.14,900);
    cursor.classList.add('down'); await sleep(150,t);
    bubble.classList.add('sel'); await move(t,bubble,.94,.88,1000);
    cursor.classList.remove('down'); await sleep(300,t);

    setCap('按「複製」，內容就先存進剪貼簿');
    await move(t,copyBtn,.5,.5,600);
    copyBtn.classList.add('press'); await click(t); copyBtn.classList.remove('press');
    copyBtn.classList.add('fin'); copyLabel.textContent='已複製'; toast.classList.add('show');
    await sleep(1100,t); toast.classList.remove('show');

    // Step 2: fly + paste
    setStep(2); chat.classList.add('dim'); device.classList.add('active');
    setCap(mode==='phone' ? '步驟 2：打開手機備忘錄，長按空白處 → 點「貼上」'
                          : '步驟 2：打開電腦的記事本，按右鍵 → 「貼上」（或直接按快捷鍵）');
    const a=pos(copyBtn), b=pos(noteBody,.45,.25), mid={x:(a.x+b.x)/2, y:Math.min(a.y,b.y)-130};
    fly.style.opacity=1;
    fly.animate([
      {transform:`translate(${a.x}px,${a.y}px) translate(-50%,-50%) scale(.5)`,opacity:0},
      {transform:`translate(${a.x}px,${a.y-30}px) translate(-50%,-50%) scale(1)`,opacity:1,offset:.15},
      {transform:`translate(${mid.x}px,${mid.y}px) translate(-50%,-50%) scale(1.05) rotate(-4deg)`,opacity:1,offset:.55},
      {transform:`translate(${b.x}px,${b.y}px) translate(-50%,-50%) scale(.7)`,opacity:.9,offset:.9},
      {transform:`translate(${b.x}px,${b.y}px) translate(-50%,-50%) scale(.4)`,opacity:0}
    ],{duration:1400,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'});
    await sleep(250,t);
    if(mode==='phone') cursor.classList.add('is-touch');
    await move(t,noteBody,.3,.3,1150);

    await click(t, mode==='phone');
    menu.classList.add('show'); await sleep(450,t);
    const target=menu.querySelector('.target');
    await move(t,target,.4,.5,450); target.classList.add('hover'); await sleep(150,t);
    await click(t); menu.classList.remove('show'); target.classList.remove('hover');

    bodyPh.style.display='none';
    for(const line of LINES){ const d=document.createElement('div'); d.textContent=line; if(line===LINES[0]) d.style.fontWeight='600'; pasted.appendChild(d);
      requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('vis'))); await sleep(110,t); }
    pasted.classList.add('flash'); await sleep(700,t); pasted.classList.remove('flash');
    await sleep(500,t);

    // Step 3: title
    setStep(3); setCap('步驟 3：標題寫「我的基本資料」，之後一找就找到');
    await move(t,noteTitle,.25,.5,700); await click(t);
    noteTitle.classList.add('focus'); titlePh.style.display='none';
    for(const ch of '我的基本資料'){ tt.textContent+=ch; await sleep(160,t); }
    await sleep(400,t); noteTitle.classList.remove('focus');
    saved.classList.add('show'); setStep(4); device.classList.remove('active');
    setCap('完成！之後要用，打開這則備忘錄再複製就好');
    place(cx+60, 560, 900);
    await sleep(3200,t);
    if(looping) run();
  }catch(e){ if(e!=='cancel') console.error(e); }
}

/* ---------- controls ---------- */
document.querySelectorAll('#cpd #modeSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#cpd #modeSeg button').forEach(x=>x.classList.toggle('on',x===b));
  mode=b.dataset.mode; device.className='device '+mode; runId++; setTimeout(run,520);
});
$('#replay').onclick=()=>run();
$('#loopBtn').onclick=e=>{ looping=!looping; e.target.textContent='自動循環：'+(looping?'開':'關'); };
function finalState(){ buildMenu(); bubble.classList.add('sel'); copyBtn.classList.add('fin'); copyLabel.textContent='已複製';
  bodyPh.style.display='none'; titlePh.style.display='none'; tt.textContent='我的基本資料';
  LINES.forEach(l=>{const d=document.createElement('div');d.textContent=l;d.className='vis';if(l===LINES[0])d.style.fontWeight='600';pasted.appendChild(d);});
  saved.classList.add('show'); setStep(4); caption.textContent='完成！之後要用，打開這則備忘錄再複製就好'; }
if (window.__SYNORA_CAPTURE__ || matchMedia('(prefers-reduced-motion: reduce)').matches) finalState(); else run();
</script>
