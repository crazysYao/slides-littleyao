<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:800px;height:600px;overflow:hidden;font-family:'PingFang TC',sans-serif;background:#fff;color:#16161a}
.top{background:#d0121b;color:#fff;font-weight:900;font-size:16px;padding:10px 32px;display:flex;justify-content:space-between}
.hero{background:#ffd400;padding:34px 32px 30px}
h1{font-size:50px;font-weight:900;line-height:1.15}
h1 em{font-style:normal;color:#d0121b}
.sub{font-size:20px;font-weight:700;margin-top:12px}
.call{display:inline-flex;align-items:center;gap:12px;margin-top:22px;background:#d0121b;color:#fff;font-size:30px;font-weight:900;padding:14px 30px;border-radius:12px;box-shadow:0 6px 0 #8d0a11}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:22px 32px}
.c{border:2px solid #16161a;border-radius:10px;padding:14px;font-size:15px;font-weight:700;line-height:1.5}
.c b{display:block;font-size:24px;color:#d0121b}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 32px}.ba div{height:100px;border-radius:10px;display:flex;align-items:flex-end;padding:10px 14px;font-weight:900;color:#fff;font-size:16px}.ba .x{background:linear-gradient(160deg,#6b7480,#3c434c)}.ba .o{background:linear-gradient(160deg,#9aa38f,#5d6b55)}
</style></head><body>
<div class="top"><span>颱風緊急搶修中</span><span>新北・桃園</span></div>
<div class="hero">
<h1>屋頂破洞？<br><em>2 小時內</em>到場搶修</h1>
<div class="sub">24 小時有人接｜先止漏，再估價</div>
<div class="call">📞 立即撥打 0912-345-678</div>
</div>
<div class="row">
<div class="c"><b>24H</b>半夜也有人接</div>
<div class="c"><b>2 小時</b>新北、桃園到場</div>
<div class="c"><b>3 小時</b>上週颱風補好的案例</div>
</div>
<div class="ba"><div class="x">搶修前：屋頂破洞</div><div class="o">搶修後：當天補好</div></div>
</body></html>
